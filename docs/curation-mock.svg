<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1200" viewBox="0 0 1480 1200" role="img" aria-labelledby="title desc">
<title id="title">NorthKeep memory review: proposed desktop and mobile screens</title>
<desc id="desc">Design mock with synthetic data. Choose a collection, inspect sources beside an editable proposal, leave uncertainty unresolved, and inspect a saved change with version recovery. These screens are proposed, not implemented.</desc>
<defs><style>
text{font-family:Arial,sans-serif;fill:#24221c;font-size:15px} .serif{font-family:Georgia,serif}.muted{fill:#6d685d}.small{font-size:12px}.label{font-size:12px;font-weight:bold;letter-spacing:1px}.heading{font-size:28px}.green{fill:#2f6a54}.white{fill:#fffdf8}.bold{font-weight:bold}.line{stroke:#e6e0d4;stroke-width:1}.panel{fill:#fffdf8;stroke:#e6e0d4}.button{fill:#2f6a54}.body{font-size:14px}
</style></defs>
<rect width="1480" height="1200" fill="#eae6dd"/>
