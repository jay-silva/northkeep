name: Site

# Deploys site/ to the Cloudflare Pages project "northkeep" (northkeep.ai).
# That project is direct-upload, so Cloudflare cannot build it from Git.
on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # npx, not wrangler-action: the action finds pnpm-lock.yaml and calls pnpm, which this runner lacks.
      - name: Deploy site/ to Cloudflare Pages
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.127.0 pages deploy . --project-name northkeep --branch main --commit-hash "$GITHUB_SHA"
